<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" type="text/css" href="static/css/styles.css">

	<title>ScriptGuesser - Learn</title>
</head>
<body>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
	<script src="static/js/script_utils.js"></script>

	<div class="container-fluid bg-dark min-vh-100 min-vw-100 d-flex flex-column text-white">
		<nav class="navbar bg-primary navbar-dark fixed-top">
			<div class="container-fluid flex-nowrap">
				<ul class="navbar-nav flex-row gap-3">
					<li class="nav-item">
						<a class="nav-link active" href="index.html">Main Menu</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="play.html">Play</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="learn.html">Learn</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="about.html">About</a>
					</li>
				</ul>
			</div>
		</nav>

		<div class="py-3"></div>

		<div class="modal fade" id="script-comparison-modal">
		  <div class="modal-dialog modal-xl">
		    <div class="modal-content">
		      <div class="modal-header">
		        <h4 class="modal-title">Script Comparison</h4>
		        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
		      </div>
		
		      <div id="script-comparison-modal-body" class="modal-body">
		        Loading scripts...
		      </div>
		
		      <div class="modal-footer">
		        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
		      </div>
		
		    </div>
		  </div>
		</div>

		<div class="row text-center align-items-center flex-grow-1 pt-5">
			<div class="col-md-2">
				<select selected="TITLE" id="country-list" class="form-select text-center" style="overflow-y: scroll; max-height: 300px;" data-live-search="true" data-live-search-style="startsWith" onchange="filterScriptsByCountry(this.value)">
					<option value="TITLE" disabled>Filter by country</option>
					<option value="ALL">Show All</option>
				</select>
			</div>
		</div>
		<div class="row align-items-center flex-grow-1">
			<div id="script-list" class="col">
			</div>
		</div>
	</div>

	<script>
		scriptList = $("#script-list")[0];

		function scrollToHash() {
			const target = $("#script-card-" + window.location.hash.substring(1))[0];

			if (!target) {
				return
			}

    		const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - $(".navbar")[0].offsetHeight;

    		for (var i of $("#script-list")[0].children) {
    			i.classList.remove("border-warning");
    		}
    		target.classList.add("border-warning");

    		window.scrollTo({
    		    top: targetPosition,
    		    behavior: 'smooth'
    		});
		}

		function filterScriptsByCountry(countryId) {
			var targetScriptsList = scriptsByCountry[countryId];

			for (var currentCard of Array.from($("#script-list")[0].children)) {
				var thisScriptId = currentCard.id.replace("script-card-", "");

				if (targetScriptsList) {
					if (targetScriptsList.includes(thisScriptId)) {
						currentCard.hidden = false;
					} else {
						currentCard.hidden = true;
					}
				} else {
					currentCard.hidden = false;
				}
			}

			if (targetScriptsList) {
				$("#country-list")[0].value = countryId;
			} else {
				$("#country-list")[0].value = "TITLE";
			}
		}

		for(var currentScript in allScripts) {
			var thisScript = allScripts[currentScript];

			// Whole card
			var card = document.createElement("div");
			card.id = "script-card-" + currentScript;
			card.className = "border-top border-bottom py-3 my-5";

			// Row
			var row = document.createElement("div");
			row.className = "row";
			card.appendChild(row)

			// Both columns
			var colMain = document.createElement("div");
			colMain.className = "col-md-8";
			row.appendChild(colMain);
			var colLoc = document.createElement("div");
			colLoc.className = "col-md-4";
			row.appendChild(colLoc);

			// Title (name) of script
			var title = document.createElement("h1");
			title.className = "display-5 pb-3";
			title.textContent = thisScript.label;
			colMain.appendChild(title);

			// Example phrase div
			var examplePhraseContainer = document.createElement("div");
			examplePhraseContainer.className = "container bg-light text-dark p-2 my-3"
			colMain.appendChild(examplePhraseContainer);
			var examplePhrase = document.createElement("p");
			examplePhrase.textContent = thisScript.example_text;
			examplePhraseContainer.appendChild(examplePhrase);

			// Script description and tip
			var description = document.createElement("p");
			description.textContent = thisScript.description;
			colMain.appendChild(description);
			var tip = document.createElement("p");
			var bold = document.createElement("b");
			tip.textContent = thisScript.tip;
			bold.appendChild(tip);
			colMain.appendChild(bold);

			// Script confusables table
			if (thisScript.confusables && thisScript.confusables.length > 0) {
				var confusablesTable = document.createElement("table");
				confusablesTable.className = "table table-hover";
				confusablesTable.innerHTML = "<thead><tr><th>Confusable With</th><th>Confusability</th><tr/></thead>";
				var confusablesTableBody = document.createElement("tbody");

				for (var currentConfusable of thisScript.confusables) {
					var confusablesTableEntry = document.createElement("tr");

					confusablesTableEntry.clickDestination = currentConfusable[0];
					confusablesTableEntry.compareScriptOne = thisScript.id;
					confusablesTableEntry.compareScriptTwo = currentConfusable[0];

					confusablesTableEntry.onclick = function() {
						$("#script-comparison-modal-body")[0].innerHTML = "Loading scripts...";
						compareScripts([this.compareScriptOne, this.compareScriptTwo], $("#script-comparison-modal-body")[0]);
					}

					//confusablesTableEntry.ondblclick = function() {
					//	filterScriptsByCountry();
					//	window.location.hash = "#" + this.clickDestination;
					//}

					confusablesTableEntry.setAttribute("data-bs-toggle", "modal");
					confusablesTableEntry.setAttribute("data-bs-target", "#script-comparison-modal");

					var confusablesTableEntryScript = document.createElement("td");
					confusablesTableEntryScript.textContent = allScripts[currentConfusable[0]].label;
					confusablesTableEntry.appendChild(confusablesTableEntryScript);

					var confusablesTableEntryScore = document.createElement("td");
					confusablesTableEntryScore.textContent = confusabilities[currentConfusable[1]];
					confusablesTableEntry.appendChild(confusablesTableEntryScore);

					confusablesTableBody.appendChild(confusablesTableEntry);
				}
				confusablesTable.appendChild(confusablesTableBody);
				colMain.appendChild(confusablesTable);
			}

			// Script map
			var map = initNewScriptMap(currentScript, function() {filterScriptsByCountry(this.id)});
			map.id = "script-card-" + currentScript + "-map";
			map.scriptDestination = currentScript;
			colLoc.appendChild(map);

			// Append whole card to script list
			scriptList.appendChild(card);
			mapZoomToCountries(map.querySelector("svg"), thisScript.countries);
		}

		for (var i of orderedScriptsByCountryIsos) {
			var option = document.createElement("option");
			option.value = i;
			option.innerHTML = countriesIso2[i];

			$("#country-list")[0].appendChild(option);
		}
		$("#country-list")[0].value = "TITLE";

		scrollToHash();

	</script>
	<script>
		addEventListener("hashchange", (e) => {
			scrollToHash();
		});
	</script>
</body>
</html>
