<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<title>ScriptGuesser - Learn</title>
</head>
<body>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
	<script src="static/js/script_utils.js"></script>

	<div class="container-fluid bg-dark min-vh-100 min-vw-100 d-flex flex-column text-white">
		<nav class="navbar bg-primary navbar-dark fixed-top">
			<div class="container-fluid flex-nowrap">
				<ul class="navbar-nav flex-row gap-3">
					<li class="nav-item">
						<a class="nav-link active" href="index.html">Main Menu</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="play.html">Play</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="learn.html">Learn</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="about.html">About</a>
					</li>
				</ul>
			</div>
		</nav>

		<div class="row align-items-center flex-grow-1">
			<div id="script-list" class="col">
			</div>
		</div>
	</div>

	<script>
		scriptList = $("#script-list")[0];

		function scrollToHash() {
			const target = $("#script-card-" + window.location.hash.substring(1))[0];

			if (!target) {
				return
			}

    		const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - $(".navbar")[0].offsetHeight;

    		for (var i of $("#script-list")[0].children) {
    			i.classList.remove("border-warning");
    		}
    		target.classList.add("border-warning");

    		window.scrollTo({
    		    top: targetPosition,
    		    behavior: 'smooth'
    		});
		}

		for(var currentScript in allScripts) {
			var thisScript = allScripts[currentScript];

			var card = document.createElement("div");
			card.id = "script-card-" + currentScript;
			card.className = "border-top border-bottom py-3 my-5";

			var row = document.createElement("div");
			row.className = "row";
			card.appendChild(row)

			var colMain = document.createElement("div");
			colMain.className = "col-md-8";
			row.appendChild(colMain);
			var colLoc = document.createElement("div");
			colLoc.className = "col-md-4";
			row.appendChild(colLoc);

			var title = document.createElement("h1");
			title.className = "display-5 pb-3";
			title.textContent = thisScript.label;
			colMain.appendChild(title);

			var examplePhraseContainer = document.createElement("div");
			examplePhraseContainer.className = "container bg-light text-dark p-2 my-3"
			colMain.appendChild(examplePhraseContainer);
			var examplePhrase = document.createElement("p");
			examplePhrase.textContent = thisScript.example_text;
			examplePhraseContainer.appendChild(examplePhrase);

			var description = document.createElement("p");
			description.textContent = thisScript.description;
			colMain.appendChild(description);
			var tip = document.createElement("p");
			tip.textContent = thisScript.tip;
			colMain.appendChild(tip);

			// Append whole card to script list
			scriptList.appendChild(card);
		}

		scrollToHash();

	</script>
	<script>
		addEventListener("hashchange", (e) => {
			scrollToHash();
		});
	</script>
</body>
</html>
